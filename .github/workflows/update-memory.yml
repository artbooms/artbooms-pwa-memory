name: Update PWA Memory

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: artbooms-pwa-memory-writes
  queue: max

jobs:
  update-memory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Update memory data
        run: python scripts/update_memory.py

      - name: Commit changes
        run: |
          git config user.name "artbooms-memory-bot"
          git config user.email "bot@users.noreply.github.com"
          git add memory-data.json
          git diff --cached --quiet || git commit -m "Update PWA memory data"

      - name: Push changes
        run: git push

      - name: Trigger OneSignal notifier
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "PWA Memory completata: avvio Notify OneSignal."

          curl \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            --fail-with-body \
            -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/notify-onesignal.yml/dispatches" \
            -d '{"ref":"main"}'

          echo "Notify OneSignal richiesto correttamente."
